<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner profile recovery</title><style>body{font:16px system-ui;max-width:520px;margin:auto;padding:25px;background:#fbf7f0;color:#503827}select,input,button{font:inherit;padding:12px;width:100%;margin:10px 0}button{background:#503827;color:white}#status{white-space:pre-wrap}</style><h1>Repair your Owner profile</h1><p>Sign in using your existing owner account. Select your own employee profile and enter its Drink PIN to link it to that account. Other employee details remain unchanged.</p><form id="repair"><select id="worker" required><option value="">Loading…</option></select><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" autocomplete="off" required aria-label="Your Drink PIN"><button id="save" disabled>Link my Owner profile</button></form><p id="status"></p><script src="sync-config.js"></script><script src="sync-core.js"></script><script>
(()=>{const form=document.getElementById('repair'),status=document.getElementById('status'),worker=document.getElementById('worker'),pin=document.getElementById('pin'),button=document.getElementById('save');let busy=false;
(async()=>{try{if(!KBRCloud.requireLogin())return;if(await KBRCloud.role()!=='owner')throw Error('Sign in with your owner email and password first.');const rows=await KBRCloud.rpc('kbr_clock_roster',{});worker.replaceChildren(new Option('Select your own name',''));for(const row of rows)worker.add(new Option(row.name+' · '+row.username,row.username));button.disabled=false;}catch(e){status.textContent=e.message;}})();
form.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;button.disabled=true;const code=pin.value;pin.value='';try{const r=await KBRCloud.rpc('kbr_repair_own_owner_profile',{p_username:worker.value,p_pin:code});if(r.error||!r.ok)throw Error(r.error||'Repair not confirmed.');status.textContent='Owner profile linked. Open Manager and use your own Drink PIN.';}catch(e){status.textContent=e.message;}finally{busy=false;button.disabled=false;}};})();
</script></html>
