<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kape' Bar-Rio · Menu Manager</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f2eb;color:#503827;font:16px system-ui}header,main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0;font:700 30px Georgia}h2{font:700 24px Georgia}a{color:#503827}button,.button{border:1px solid #d7c6b5;border-radius:10px;padding:12px 16px;background:white;color:#503827;font:700 15px system-ui;cursor:pointer;display:inline-block}button.primary{background:#386944;color:white;border-color:#386944}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select{font:inherit;border:1px solid #cbb9a6;border-radius:8px;padding:11px;width:100%;background:white}label{display:block;margin:14px 0 6px;font-weight:650}article{background:white;border:1px solid #e2d5c7;border-radius:14px;padding:18px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:16px}article h3{margin:0 0 5px}small{color:#786658}dialog{width:min(660px,95vw);border:0;border-radius:20px;padding:24px;max-height:90vh}dialog::backdrop{background:#24180ea8}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}.row button{color:#b12525}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.muted{color:#786658;line-height:1.5}#status{position:sticky;top:0;background:#edf6ea;padding:12px;border-radius:10px;display:none}#error{color:#b12525}img.preview{max-height:100px;max-width:160px;display:block;margin-top:10px}@media(max-width:550px){header,main{padding:16px}header{align-items:start}h1{font-size:24px}.row{grid-template-columns:1fr 95px auto}article{align-items:start}}
</style><link rel="stylesheet" href="sync.css"><link rel="stylesheet" href="page-tools.css"></head><body><header><div><h1>Menu Manager</h1><small>Kape' Bar-Rio</small></div></header><main><p class="muted">Edit your menu and prices here. Saved changes sync through Supabase and apply to new orders on every connected ordering device. Existing orders keep their original prices.</p><div id="status" role="status"></div><div class="tools"><button class="primary" id="add">+ Add menu item</button><button id="export">Export menu backup</button><label class="button" style="margin:0">Import menu backup<input id="import" type="file" accept="application/json,.json" hidden></label></div><p class="muted">Both apps use the same shared menu. Backups are for export and recovery.</p><input id="search" placeholder="Search item or category" aria-label="Search menu"><div id="list"></div></main>
<dialog id="editor"><form id="form"><h2 id="title">Add menu item</h2><label for="name">Item name</label><input id="name" required maxlength="100"><label for="category">Category</label><input id="category" required list="categories" maxlength="100"><datalist id="categories"></datalist><label for="availability">Availability</label><select id="availability"><option value="available">Available</option><option value="not-available">Not Available — show in menu, cannot order</option><option value="out-of-stock">Out of Stock — hide from ordering menu</option></select><label class="check"><input id="food" type="checkbox">Food item (no sweetness options)</label><label>Standard sizes and prices (₱)</label><div id="standard"></div><button type="button" id="addSize">+ Add size</button><label class="check"><input id="premiumEnabled" type="checkbox">Offer premium options</label><div id="premiumPanel" hidden><label>Premium sizes and prices (₱)</label><div id="premium"></div><button type="button" id="addPremium">+ Add premium size</button></div><label for="image">Photo URL or images/ path (optional)</label><input id="image" placeholder="images/my-drink.jpg"><label for="photo">Or upload a photo</label><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><img class="preview" id="preview" alt="Photo preview" hidden><p id="error" role="alert"></p><div class="tools"><button class="primary" type="submit">Save item</button><button id="cancel" type="button">Cancel</button></div></form></dialog><script src="app-links.js"></script><script src="menu-defaults.js"></script><script src="menu-store.js"></script><script src="menu.js"></script><script src="sync-config.js"></script><script src="sync-core.js"></script><script src="sync-ui.js"></script><script src="menu-sync.js"></script><script src="page-tools.js"></script></body></html>
