<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Kape' Bar-Rio · Reset Password</title><link rel="stylesheet" href="sync.css"></head><body style="background:#f7f2eb"><main class="cloud-screen"><section class="cloud-box"><h1>Reset your password</h1><form id="request"><p>Enter your staff email to receive a new reset link.</p><label for="email">Staff email</label><input id="email" type="email" autocomplete="username" required><button>Send reset email</button></form><form id="change" hidden><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button>Save new password</button></form><p id="message" role="status" aria-live="polite"></p><p><a href="sync-login.html">Back to sign in</a></p></section></main><script src="sync-config.js"></script><script src="reset-password.js"></script></body></html>
