<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6b3f24">
  <title>KBR Rewards</title>
  <link rel="stylesheet" href="rewards.css?v=44">
</head>
<body>
  <header class="rewards-topbar">
    <button id="backButton" class="back-button" type="button" aria-label="Back">←</button>
    <div>
      <div class="eyebrow">Kape Bar-Rio</div>
      <h1>Rewards</h1>
    </div>
  </header>

  <main class="rewards-shell">
    <section class="balance-card">
      <div>
        <div class="eyebrow light">Your KBR Points</div>
        <div id="pointsBalance" class="points-balance">0</div>
      </div>
      <div class="reward-value-box">
        <span>Unlocked reward value</span>
        <strong id="rewardValue">₱0</strong>
      </div>
    </section>

    <p class="rule-note">
      ₱1 spent on eligible drinks = 1 point. Food and ice cream do not earn points.
      Every 1,000 points unlocks ₱49 of reward value.
    </p>

    <section>
      <div class="section-heading">
        <div>
          <div class="eyebrow">Available to you</div>
          <h2>Drinks you can afford with your points</h2>
        </div>
      </div>

      <div id="rewardGrid" class="reward-grid"></div>
      <div id="rewardEmpty" class="empty-state hidden">
        You don't have enough points for a drink yet.
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="rewards.js?v=44" defer></script>
</body>
</html>
