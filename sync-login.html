<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kape' Bar-Rio · Staff Login</title><link rel="stylesheet" href="sync.css"><link rel="stylesheet" href="page-tools.css"></head><body style="background:#f7f2eb"><main class="cloud-screen"><form id="loginForm" class="cloud-box"><h1>Kape' Bar-Rio</h1><p>Sign in with your owner account to open manager tools.</p><label for="email">Username or staff email</label><input id="email" type="text" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p class="cloud-error" id="error" role="alert"></p><button id="signIn">Sign in</button><p><a href="reset-password.html">Forgot password?</a></p><p style="font-size:13px">Baristas use the username and password set by the owner. Existing owner email logins still work.</p></form></main><script src="sync-config.js"></script><script src="sync-core.js"></script><script>
const loginForm=document.getElementById('loginForm'),loginEmail=document.getElementById('email'),loginPassword=document.getElementById('password'),loginError=document.getElementById('error'),loginSubmit=document.getElementById('signIn');
loginForm.onsubmit=async e=>{e.preventDefault();loginSubmit.disabled=true;loginError.textContent='';try{await KBRCloud.login(loginEmail.value.trim().includes('@')?loginEmail.value.trim():loginEmail.value.trim().toLowerCase()+'@staff.kapebarrio.invalid',loginPassword.value);loginPassword.value='';if(await KBRCloud.role()!=='owner')throw new Error('Owner login required for Manager.');const wanted=new URLSearchParams(location.search).get('next');location.href=["index.html", "manager.html", "menu.html", "sales.html"].includes(wanted)?wanted:'index.html';}catch(err){loginError.textContent=err.message;}finally{loginSubmit.disabled=false;}};
</script><script src="page-tools.js"></script></body></html>
